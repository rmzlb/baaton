name: CI

# Ce workflow teste, et rien d'autre. Le déploiement appartient à Dokploy :
# les deux applications (`api`, `frontend`) sont en `sourceType: github`,
# `autoDeploy: true`, `triggerType: push` sur `main`, donc la GitHub App
# Dokploy déclenche déjà un build à chaque push.
#
# Il y avait ici un job `deploy` qui rappelait `application.deploy` sur les
# mêmes deux app IDs : deux builds pour un commit sur belotte (r7g.large, qui
# compile Rust en release), et un secret `DOKPLOY_API_TOKEN` dans le repo pour
# refaire ce que le webhook faisait déjà. Supprimé.
#
# Conséquence assumée : un test rouge n'empêche pas le déploiement, il ne
# l'empêchait déjà pas (le 2026-09-13, `main` était rouge sur 7 tests de copy
# et les deux applications se sont déployées quand même). Ce fichier est un
# signal, pas une barrière. La barrière, si elle est voulue un jour, se pose
# côté Dokploy : builder l'image en CI, la pousser sur un registre, et laisser
# Dokploy déployer ce tag — c'est l'approche que recommande sa doc
# (`/docs/core/applications/going-production`), qui évite en plus de compiler
# sur le serveur applicatif.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push qui en remplace un autre annule le run précédent — économise des
# minutes Actions sur les séries de commits rapprochés.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Backend ──────────────────────────────────────────────────────────
      # `cargo test` en debug, pas `--release` : Dokploy rebuild le release
      # dans son Dockerfile de toute façon, le refaire ici doublait le temps
      # de CI pour un artefact jeté.
      #
      # `--bins` et pas `--lib` / `--test '*'` : le crate n'a pas de
      # `src/lib.rs` ni de fichier dans `tests/`, donc les deux anciens steps
      # échouaient avec "no library targets found" / "no test target matches"
      # et les 61 tests réels (dans le binaire) ne tournaient jamais.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # `#![deny(clippy::string_slice)]` in `src/main.rs` is the guard that
      # keeps byte-indexed `&s[..n]` out of the codebase. Byte slicing panics
      # whenever the index lands inside a multibyte scalar, which took down
      # tokio workers in prod on French issue titles (2026-08-24). The lint is
      # only worth anything if CI enforces it, so run clippy before the tests.
      # Not `-D warnings`: the crate still carries pre-existing style warnings,
      # and the crate-level `deny` already fails the build on its own.
      - name: Backend lint (deny byte-indexed string slices)
        working-directory: backend
        run: cargo clippy --all-targets

      - name: Backend tests
        working-directory: backend
        run: cargo test --bins

      # ── Frontend ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm run test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
