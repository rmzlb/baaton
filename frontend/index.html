<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="A project board for client work in the age of agents. One link per client, no account. Your agents read the request over the API, do the work and write down what changed. Every agent action carries a human name." />
    <!-- Standalone PWA. `mobile-web-app-capable` is the modern tag; the legacy
         apple- prefixed one is still required by older iOS versions.
         `black-translucent` renders content behind the status bar — safe areas
         are reserved in CSS (see globals.css `.safe-pt` / `.safe-pb`). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Baaton" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS turns phone-number-looking strings (issue ids, counts) into links
         in standalone mode, which breaks layout and taps. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://baaton.dev" />
    <meta property="og:title" content="Baaton. The client writes, your agent ships, you decide." />
    <meta property="og:description" content="One link per client, no account. Your agents pick up the request over the API, do the work and write down what changed. Works with Claude Code, Codex, Cursor, OpenClaw and any agent that speaks HTTP." />
    <meta property="og:image" content="https://baaton.dev/og-v3-1d37f798.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Baaton: 133 REST endpoints, 60ms, terminal showing AI agent workflow" />
    <meta property="og:site_name" content="Baaton" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@rmzlb" />
    <meta name="twitter:title" content="Baaton. The client writes, your agent ships, you decide." />
    <meta name="twitter:description" content="One link per client, no account. Your agents pick up the request over the API, do the work and write down what changed. Works with Claude Code, Codex, Cursor, OpenClaw and any agent that speaks HTTP." />
    <meta name="twitter:image" content="https://baaton.dev/og-v3-1d37f798.png" />
    <meta name="twitter:image:alt" content="Baaton: terminal showing AI agent creating issues, posting TLDRs, handing off to humans" />

    <!-- Additional SEO -->
    <link rel="canonical" href="https://baaton.dev" />
    <meta name="author" content="Baaton" />
    <meta name="keywords" content="project management, AI agents, issue tracker, kanban, API-first, developer tools, sprint planning, gamification" />
    <meta name="robots" content="index, follow" />

    <link rel="manifest" href="/manifest.json" />
    <!-- iOS ignores SVG here — must be a PNG, 180x180, no transparency. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Baaton. The client writes, your agent ships, you decide.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Baaton",
      "description": "Project board for client work with AI coding agents: one link per client, agents work over a REST API, every action carries a human name.",
      "url": "https://baaton.dev",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "rmzlb",
        "url": "https://github.com/rmzlb"
      }
    }
    </script>
  </head>
  <body class="bg-bg text-primary antialiased selection:bg-accent selection:text-black overflow-x-hidden">
    <script>
      // Sync theme before first paint to avoid flash
      (function(){var t=localStorage.getItem('baaton-theme');if(t==='dark')document.documentElement.classList.add('dark');})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
