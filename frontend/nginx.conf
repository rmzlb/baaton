server {
    # Port 80 as uid 101: Docker (>= 20.10) sets ip_unprivileged_port_start=0
    # in container namespaces, so the Dokploy domains keep targeting :80.
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # A location with its own add_header drops the server-level ones, so every
    # such location below includes the snippet again.
    include /etc/nginx/snippets/nginx-security-headers.conf;

    # Top-level files (sw.js, manifest.json, llms.txt…) are always revalidated;
    # unknown paths are SPA routes and get index.html.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/nginx-security-headers.conf;
        try_files $uri $uri/ @spa;
    }

    location @spa {
        include /etc/nginx/snippets/nginx-html-headers.conf;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/nginx-html-headers.conf;
    }

    # Public share pages are meant to be embedded on other sites
    # (iframe snippet in PublicLinkModal): same HTML, no framing ban.
    location /s/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/nginx-security-headers.conf;
        try_files /index.html =404;
    }

    # Vite assets carry a content hash in their name. No "always": a 404 must
    # not be cached for a year.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/nginx-security-headers.conf;
        try_files $uri =404;
    }

    # Unhashed media (landing film, demo videos, icons): cacheable, not immutable.
    location ~* \.(png|jpg|jpeg|gif|webp|avif|ico|svg|woff2|woff|ttf|mp4|webm)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/nginx-security-headers.conf;
        try_files $uri =404;
    }
}
